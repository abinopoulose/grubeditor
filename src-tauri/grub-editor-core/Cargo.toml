[package]
name = "grub-editor-core"
version = "0.1.0"
description = "Core library for distribution-aware GRUB config parsing, theme verification, and rollback snapshots"
authors = ["GrubEditor Team"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
regex = "1"
