[workspace]
members = [".", "grub-editor-core", "grub-editor-helper"]

[package]
name = "tauri-app"
version = "0.1.0"
description = "GrubEditor - Modern GRUB Customizer for Linux"
authors = ["GrubEditor Team"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grub-editor-core = { path = "./grub-editor-core" }
