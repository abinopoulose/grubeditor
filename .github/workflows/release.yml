name: Release Ubuntu Application & DEB Package

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  release-ubuntu-binaries:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Install System Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          
      - name: Setup Node.js & npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          
      - name: Install Node Dependencies
        run: npm ci
        
      - name: Build Native Application & Debian Installer (.deb)
        run: npm run tauri build
        
      - name: Stage Universal Release Tarball
        run: |
          mkdir -p release-stage/packaging
          cp install.sh uninstall.sh README.md release-stage/
          cp -r packaging/* release-stage/packaging/
          cp src-tauri/target/release/tauri-app release-stage/grubeditor
          cp src-tauri/target/release/grub-editor-helper release-stage/grub-editor-helper
          tar -czf grubeditor-linux-amd64.tar.gz -C release-stage .
          
      - name: Publish GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            grubeditor-linux-amd64.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
